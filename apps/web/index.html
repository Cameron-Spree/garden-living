<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Living Web Preview</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
      input, button, select { padding: 0.5rem; margin: 0.25rem 0; }
      input, select { width: 100%; box-sizing: border-box; }
      button { cursor: pointer; }
      .row { display: flex; gap: 0.5rem; }
      .row > button { flex: 1; }
      .muted { color: #666; }
      .task { display: flex; justify-content: space-between; border-top: 1px solid #eee; padding: 0.5rem 0; }
      .hidden { display: none; }
      .error { color: #c20000; }
    </style>
  </head>
  <body>
    <h1>Garden Living (Web Preview)</h1>
    <p class="muted">This browser client mirrors the MVP auth + tasks + streak flow so you can demo without Expo Go.</p>

    <section id="authCard" class="card">
      <h2>Sign in / Register</h2>
      <input id="email" placeholder="Email" value="demo@garden.app" />
      <input id="password" type="password" placeholder="Password" value="password123" />
      <input id="handle" placeholder="Handle" value="plantfriend" />
      <input id="displayName" placeholder="Display name" value="Plant Friend" />
      <div class="row">
        <button id="registerBtn">Register</button>
        <button id="loginBtn">Login</button>
      </div>
      <p id="authError" class="error"></p>
    </section>

    <section id="appCard" class="card hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Today's Tasks</h2>
        <button id="logoutBtn">Logout</button>
      </div>
      <p id="streakText">Streak: 0 days · 0/7 actions</p>

      <div class="card" style="margin: 0;">
        <h3>Add Task</h3>
        <input id="taskTitle" placeholder="Task title" value="Water basil" />
        <select id="taskType">
          <option value="water">water</option>
          <option value="prune">prune</option>
          <option value="feed">feed</option>
          <option value="inspect">inspect</option>
          <option value="harvest">harvest</option>
        </select>
        <button id="addTaskBtn">Add Task</button>
      </div>

      <h3 style="margin-top:1rem;">Task List</h3>
      <div id="taskList"></div>
      <p id="appError" class="error"></p>
    </section>

    <script src="./main.js"></script>
  </body>
</html>
