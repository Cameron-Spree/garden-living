version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garden_living
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/garden_living
      JWT_SECRET: super-secret
    depends_on:
      - postgres
    ports:
      - '4000:4000'

  mobile:
    build:
      context: ./apps/mobile
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - '8081:8081'

volumes:
  pgdata:
