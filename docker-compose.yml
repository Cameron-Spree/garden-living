version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garden_living
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d garden_living']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/garden_living
      JWT_SECRET: super-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  mobile:
    build:
      context: ./apps/mobile
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8081:8081'

  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app:ro
    command: python -m http.server 4173 --bind 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '4173:4173'

volumes:
  pgdata:
